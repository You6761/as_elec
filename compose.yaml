# version: "3.8"
services:
  database:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: passwordbdd
      MYSQL_DATABASE: as_elec
      MYSQL_USER: symfony
      MYSQL_PASSWORD: symfony
    ports:
      - "4306:3306"
    volumes:
      - ./mysql:/var/lib/mysql
  php:
    image: php:8.2-fpm
    volumes:
      - ./:/var/www/symfony
    depends_on:
      - database
  webserver:
    image: nginx:alpine
    volumes:
      - ./:/var/www/symfony
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8080:80"
    depends_on:
      - php
  adminer:
    image: adminer
    ports:
      - 8081:8080
